# =============================================================
# GitHub Actions CI
# -------------------------------------------------------------
# 作用: 验证层（不是准入层）
#   - 加固 verify 必跑纪律（详见 docs/adr/0002-verify-hard-gate.md）
#   - CI 跑出的结果可作为 verify 报告的事实证据
#   - 不替代 L3 Pre-Implementation Approval Gate
#     （详见 docs/adr/0005-l3-approval-gate.md；那是准入层）
#
# 5 个 job 与本地 `bash scripts/scaffold-doctor.sh --template`
# + 单测 + 集成测试 等价；任何一个失败都阻断本次 PR/MR 合并建议。
#
# 零第三方依赖：所有检查器都在仓库内（scripts/*.py / *.sh）；
# Python 3 标准库 + POSIX bash 即可执行。
# =============================================================

name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------
  # lint-shell — bash 语法校验（POSIX/bash 解析，不执行）
  # -----------------------------------------------------------------
  lint-shell:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts/scaffold-doctor.sh
        run: bash -n scripts/scaffold-doctor.sh
      - name: bash -n scripts/worktree-add.sh
        run: bash -n scripts/worktree-add.sh
      - name: bash -n scripts/hooks/rewrite-worktree-add.sh
        run: bash -n scripts/hooks/rewrite-worktree-add.sh

  # -----------------------------------------------------------------
  # lint-python — Python 检查器与单测
  # -----------------------------------------------------------------
  lint-python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python3 -m unittest discover
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  # -----------------------------------------------------------------
  # check-links — Markdown 相对链接检查
  # -----------------------------------------------------------------
  check-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python3 scripts/check-markdown-links.py --root . --template
        run: python3 scripts/check-markdown-links.py --root . --template

  # -----------------------------------------------------------------
  # check-governance — 治理规则一致性（GOV001-GOV004）
  # -----------------------------------------------------------------
  check-governance:
    name: Governance consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python3 scripts/check-governance-consistency.py --root . --template
        run: python3 scripts/check-governance-consistency.py --root . --template

  # -----------------------------------------------------------------
  # check-doctor — 聚合自检（结构 + 链接 + 一致性 + 集成测试）
  # -----------------------------------------------------------------
  check-doctor:
    name: Scaffold doctor (template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash scripts/scaffold-doctor.sh --template
        run: bash scripts/scaffold-doctor.sh --template
      - name: bash scripts/tests/scaffold-doctor-test.sh
        run: bash scripts/tests/scaffold-doctor-test.sh
      - name: bash scripts/tests/worktree-add-test.sh
        run: bash scripts/tests/worktree-add-test.sh
