# =============================================================
# GitLab CI
# -------------------------------------------------------------
# 作用: 验证层（不是准入层）
#   - 加固 verify 必跑纪律（详见 docs/adr/0002-verify-hard-gate.md）
#   - CI 跑出的结果可作为 verify 报告的事实证据
#   - 不替代 L3 Pre-Implementation Approval Gate
#     （详见 docs/adr/0005-l3-approval-gate.md；那是准入层）
#
# 镜像: 官方 alpine（自带 bash + python3 + git；apk add 仅作为
#       防御性兜底，便于镜像升级时仍能跑测试）。
# 5 个 job 与本地 `bash scripts/scaffold-doctor.sh --template`
# + 单测 + 集成测试 等价；与 .github/workflows/ci.yml 同口径。
#
# 零第三方依赖：所有检查器都在仓库内（scripts/*.py / *.sh）；
# Python 3 标准库 + POSIX bash 即可执行。
# =============================================================

stages:
  - lint
  - check

variables:
  GIT_DEPTH: "10"

# ---------- 共享脚本：基础镜像 + 工具链 + checkout ----------
.base_template: &base_template
  image: alpine:3
  before_script:
    - apk add --no-cache bash python3 git
    - git --version
    - python3 --version
    - bash --version

# -----------------------------------------------------------------
# lint 阶段：语法校验 + Python 单测
# -----------------------------------------------------------------
lint-shell:
  stage: lint
  <<: *base_template
  script:
    - bash -n scripts/scaffold-doctor.sh
    - bash -n scripts/worktree-add.sh
    - bash -n scripts/hooks/rewrite-worktree-add.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-python:
  stage: lint
  <<: *base_template
  script:
    - python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------
# check 阶段：链接 / 一致性 / 聚合 doctor + 集成测试
# -----------------------------------------------------------------
check-links:
  stage: check
  <<: *base_template
  script:
    - python3 scripts/check-markdown-links.py --root . --template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check-governance:
  stage: check
  <<: *base_template
  script:
    - python3 scripts/check-governance-consistency.py --root . --template
  rules:
    - if: $CI_PELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check-doctor:
  stage: check
  <<: *base_template
  script:
    - bash scripts/scaffold-doctor.sh --template
    - bash scripts/tests/scaffold-doctor-test.sh
    - bash scripts/tests/worktree-add-test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
